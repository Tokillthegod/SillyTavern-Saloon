<div class="flex-container flexFlowColumn justifyLeft flexGap10">
    <h3>设置安全问题</h3>
    <p>安全问题可以帮助您在忘记密码时找回密码。请选择一个问题并提供只有您知道的答案。</p>
    
    <div class="flex-container flexFlowColumn flexGap10">
        <label for="securityQuestionSelect">选择安全问题：</label>
        <select id="securityQuestionSelect" class="text_pole" required>
            <option value="">请选择一个安全问题</option>
            <option value="What is your mother's maiden name?">您母亲的娘家姓是什么？</option>
            <option value="What was the name of your first pet?">您第一只宠物的名字是什么？</option>
            <option value="In what city were you born?">您出生在哪个城市？</option>
            <option value="What was the name of your favorite teacher?">您最喜欢的老师叫什么名字？</option>
            <option value="What was the name of your elementary school?">您的小学叫什么名字？</option>
            <option value="What is the name of your best friend?">您最好朋友的名字是什么？</option>
        </select>
        
        <label for="securityAnswerInput">您的答案：</label>
        <input id="securityAnswerInput" class="text_pole" type="text" placeholder="请输入您的答案" required>
        
        <div class="currentSecurityQuestionBlock" style="display: none;">
            <h4>当前安全问题：</h4>
            <p class="currentSecurityQuestion" style="font-style: italic; color: #666;"></p>
        </div>
        
        <div class="passwordConfirmBlock">
            <label for="passwordConfirm">确认您的密码：</label>
            <input id="passwordConfirm" class="text_pole" type="password" placeholder="请输入您的当前密码" required>
        </div>
    </div>
</div>
